<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsión de Viento</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --header-bg: #1a365d;
            --text: #2d3748;
            --subtext: #718096;
            --border: #e2e8f0;
            --accent: #3182ce;
            --accent-hover: #2c5282;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--header-bg);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { font-size: 1.4rem; font-weight: 600; }
        header p  { font-size: 0.8rem; opacity: 0.7; margin-top: 0.15rem; }

        /* Legend in header */
        .header-legend {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }

        .legend-chip {
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.72rem;
        }

        .add-bar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0.65rem 2rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap input {
            width: 260px;
            padding: 0.45rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(49,130,206,0.2);
        }

        .dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            z-index: 300;
            overflow: hidden;
        }

        .dropdown div {
            padding: 0.55rem 0.75rem;
            cursor: pointer;
            font-size: 0.88rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .dropdown div:last-child { border-bottom: none; }
        .dropdown div:hover { background: #ebf8ff; }

        .btn {
            padding: 0.45rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: background 0.15s, opacity 0.15s;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
        .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.78rem; }
        .btn-danger { background: #e53e3e; color: white; }
        .btn-danger:hover { background: #c53030; }
        .btn-ghost { background: rgba(255,255,255,0.15); color: white; }
        .btn-ghost:hover { background: rgba(255,255,255,0.25); }

        main {
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .empty-state {
            text-align: center;
            color: var(--subtext);
            padding: 4rem 2rem;
            font-size: 1rem;
        }

        /* Location card */
        .location-card {
            background: var(--card);
            border-radius: 10px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.09);
            overflow: hidden;
        }

        .loc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            background: linear-gradient(135deg, #2b6cb0, #3182ce);
            color: white;
        }

        .loc-header h2 { font-size: 1.05rem; font-weight: 600; }
        .loc-header .coords { font-size: 0.73rem; opacity: 0.8; margin-top: 0.1rem; }

        .loc-actions { display: flex; gap: 0.5rem; align-items: center; }

        .loc-body { }

        .loc-loading, .loc-error {
            padding: 2rem;
            text-align: center;
            color: var(--subtext);
        }

        .loc-error { color: #e53e3e; }

        /* Table */
        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.81rem;
            min-width: 700px;
        }

        thead th {
            background: #edf2f7;
            padding: 0.45rem 0.5rem;
            text-align: center;
            font-weight: 600;
            color: var(--subtext);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        thead th.col-time {
            text-align: left;
            position: sticky;
            left: 0;
            background: #edf2f7;
            z-index: 10;
            min-width: 68px;
        }

        tbody tr { transition: background 0.1s; }
        tbody tr:nth-child(even):not(.day-row) { background: #f7fafc; }
        tbody tr:not(.day-row):hover { background: #ebf8ff; }

        tbody td {
            padding: 0.38rem 0.5rem;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }

        tbody td.col-time {
            text-align: left;
            position: sticky;
            left: 0;
            font-weight: 500;
            background: white;
            z-index: 5;
        }

        tbody tr:nth-child(even):not(.day-row) td.col-time { background: #f7fafc; }
        tbody tr:not(.day-row):hover td.col-time { background: #ebf8ff; }

        /* Day separator rows */
        .day-row td {
            background: #bee3f8 !important;
            color: #2c5282;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 0.3rem 0.75rem;
            letter-spacing: 0.02em;
        }

        /* Wind cell */
        .wc {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            justify-content: center;
        }

        .spd {
            padding: 0.13rem 0.38rem;
            border-radius: 4px;
            font-weight: 700;
            min-width: 34px;
            display: inline-block;
            text-align: center;
        }

        /* Speed color classes */
        .s0 { background: #c6f6d5; color: #276749; }   /* < 10  */
        .s1 { background: #fefcbf; color: #744210; }   /* 10–20 */
        .s2 { background: #feebc8; color: #7b341e; }   /* 20–30 */
        .s3 { background: #fed7d7; color: #742a2a; }   /* 30–40 */
        .s4 { background: #9b2c2c; color: white;   }   /* ≥ 40  */

        .arrow {
            display: inline-block;
            font-size: 1rem;
            line-height: 1;
        }

        @media (max-width: 640px) {
            header { padding: 0.75rem 1rem; }
            .header-legend { display: none; }
            main { padding: 0.75rem 1rem; }
            .add-bar { padding: 0.5rem 1rem; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>🌬️ Previsión de Viento</h1>
        <p>Próximas 72 horas · Open-Meteo</p>
    </div>
    <div class="header-legend">
        <span style="opacity:.7">km/h:</span>
        <span class="legend-chip s0">&lt;10</span>
        <span class="legend-chip s1">10–20</span>
        <span class="legend-chip s2">20–30</span>
        <span class="legend-chip s3">30–40</span>
        <span class="legend-chip s4">≥40</span>
        <span style="opacity:.65;margin-left:.4rem">↑ dirección de destino del viento</span>
    </div>
</header>

<div class="add-bar">
    <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Añadir ubicación…" autocomplete="off">
        <div class="dropdown" id="dropdown" style="display:none"></div>
    </div>
    <button class="btn btn-primary" id="searchBtn" onclick="handleSearch()">Buscar</button>
</div>

<main id="main"></main>

<script>
const API   = 'https://api.open-meteo.com/v1/forecast';
const GEO   = 'https://geocoding-api.open-meteo.com/v1/search';
const PARAMS = 'wind_speed_10m,wind_speed_80m,wind_speed_120m,wind_speed_180m,wind_direction_10m,wind_direction_80m,wind_direction_120m,wind_direction_180m,wind_gusts_10m';

const DEFAULT_LOCATIONS = [
    { name: 'Lora del Río',    lat: 37.6551, lon: -5.5197 },
    { name: 'Algodonales',     lat: 36.8934, lon: -5.4039 },
    { name: 'Utrera',          lat: 37.1850, lon: -5.7836 },
    { name: 'Matalascañas',    lat: 37.0086, lon: -6.5558 },
];

let locations = [...DEFAULT_LOCATIONS];
const cache   = new Map();
let geoTimer  = null;

/* ── helpers ──────────────────────────────────────────────────── */

function spdClass(v) {
    if (v < 10) return 's0';
    if (v < 20) return 's1';
    if (v < 30) return 's2';
    if (v < 40) return 's3';
    return 's4';
}

function arrowHtml(deg) {
    const rot = (deg + 180) % 360;
    return `<span class="arrow" style="transform:rotate(${rot}deg)">↑</span>`;
}

function windCell(speed, dir) {
    return `<div class="wc"><span class="spd ${spdClass(speed)}">${speed.toFixed(1)}</span>${arrowHtml(dir)}</div>`;
}

function gustCell(speed) {
    return `<span class="spd ${spdClass(speed)}" style="font-style:italic">${speed.toFixed(1)}</span>`;
}

function isoTime(s) { return s.split('T')[1]; }   // "14:00"

function isoDate(s) {
    const [y, m, d] = s.split('T')[0].split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long'
    });
}

/* ── API ──────────────────────────────────────────────────────── */

async function fetchWeather(loc) {
    const key = `${loc.lat},${loc.lon}`;
    if (cache.has(key)) return cache.get(key);
    const url = `${API}?latitude=${loc.lat}&longitude=${loc.lon}&hourly=${PARAMS}&timezone=auto&forecast_days=3`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    cache.set(key, data);
    return data;
}

/* ── build table ──────────────────────────────────────────────── */

function buildTable(data) {
    const h = data.hourly;
    let html = `
        <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th class="col-time">Hora</th>
                    <th>10 m</th>
                    <th>80 m</th>
                    <th>120 m</th>
                    <th>180 m</th>
                    <th>Rachas 10m</th>
                </tr>
            </thead>
            <tbody>`;

    let lastDay = '';
    for (let i = 0; i < h.time.length; i++) {
        const day = h.time[i].split('T')[0];
        if (day !== lastDay) {
            html += `<tr class="day-row"><td colspan="6">${isoDate(h.time[i])}</td></tr>`;
            lastDay = day;
        }
        html += `<tr>
            <td class="col-time">${isoTime(h.time[i])}</td>
            <td>${windCell(h.wind_speed_10m[i],  h.wind_direction_10m[i])}</td>
            <td>${windCell(h.wind_speed_80m[i],  h.wind_direction_80m[i])}</td>
            <td>${windCell(h.wind_speed_120m[i], h.wind_direction_120m[i])}</td>
            <td>${windCell(h.wind_speed_180m[i], h.wind_direction_180m[i])}</td>
            <td>${gustCell(h.wind_gusts_10m[i])}</td>
        </tr>`;
    }

    html += `</tbody></table></div>`;
    return html;
}

/* ── render ───────────────────────────────────────────────────── */

async function renderLocation(idx) {
    const card = document.getElementById(`card-${idx}`);
    if (!card) return;
    const body = card.querySelector('.loc-body');
    body.innerHTML = '<div class="loc-loading">Cargando datos…</div>';
    try {
        const data = await fetchWeather(locations[idx]);
        body.innerHTML = buildTable(data);
    } catch (e) {
        body.innerHTML = `<div class="loc-error">Error al cargar datos: ${e.message}</div>`;
    }
}

function createCard(idx) {
    const loc  = locations[idx];
    const card = document.createElement('div');
    card.className = 'location-card';
    card.id = `card-${idx}`;
    card.innerHTML = `
        <div class="loc-header">
            <div>
                <h2>${loc.name}</h2>
                <div class="coords">${loc.lat.toFixed(4)}°N · ${loc.lon.toFixed(4)}°E</div>
            </div>
            <div class="loc-actions">
                <button class="btn btn-ghost btn-sm" onclick="refreshCard(${idx})">↻ Actualizar</button>
                <button class="btn btn-danger btn-sm" onclick="removeLocation(${idx})">✕ Eliminar</button>
            </div>
        </div>
        <div class="loc-body"></div>`;
    return card;
}

function renderAll() {
    const main = document.getElementById('main');
    main.innerHTML = '';
    if (locations.length === 0) {
        main.innerHTML = '<div class="empty-state">Sin ubicaciones. Añade una con el buscador.</div>';
        return;
    }
    locations.forEach((_, i) => {
        const card = createCard(i);
        main.appendChild(card);
        renderLocation(i);
    });
}

function removeLocation(idx) {
    const key = `${locations[idx].lat},${locations[idx].lon}`;
    cache.delete(key);
    locations.splice(idx, 1);
    renderAll();
}

async function refreshCard(idx) {
    const key = `${locations[idx].lat},${locations[idx].lon}`;
    cache.delete(key);
    await renderLocation(idx);
}

function appendLocation(loc) {
    locations.push(loc);
    const idx  = locations.length - 1;
    const main = document.getElementById('main');
    // remove empty state if present
    const empty = main.querySelector('.empty-state');
    if (empty) empty.remove();
    const card = createCard(idx);
    main.appendChild(card);
    renderLocation(idx);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── geocoding search ─────────────────────────────────────────── */

const searchInput = document.getElementById('searchInput');
const dropdown    = document.getElementById('dropdown');

searchInput.addEventListener('input', () => {
    clearTimeout(geoTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { dropdown.style.display = 'none'; return; }
    geoTimer = setTimeout(() => doGeoSearch(q), 380);
});

searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSearch();
    if (e.key === 'Escape') dropdown.style.display = 'none';
});

document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) dropdown.style.display = 'none';
});

async function doGeoSearch(query) {
    try {
        const res  = await fetch(`${GEO}?name=${encodeURIComponent(query)}&count=6&language=es&format=json`);
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
            dropdown.innerHTML = '<div style="color:#718096;cursor:default">Sin resultados</div>';
            dropdown.style.display = 'block';
            return;
        }
        dropdown.innerHTML = '';
        data.results.forEach(r => {
            const row   = document.createElement('div');
            const parts = [r.name, r.admin1, r.country].filter(Boolean);
            row.textContent = parts.join(', ');
            row.onclick = () => {
                dropdown.style.display = 'none';
                searchInput.value = '';
                appendLocation({ name: r.name, lat: r.latitude, lon: r.longitude });
            };
            dropdown.appendChild(row);
        });
        dropdown.style.display = 'block';
    } catch (e) {
        console.error('Geocoding error:', e);
    }
}

async function handleSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    await doGeoSearch(q);
}

/* ── init ─────────────────────────────────────────────────────── */
renderAll();
</script>
</body>
</html>
